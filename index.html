<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eee7dc" />
  <title>2026 交班月曆</title>
  <style>
    :root {
      --bg: #eee8df;
      --panel: #fbf8f2;
      --panel-2: #f5efe6;
      --panel-3: #e8ded2;
      --text: #312c28;
      --muted: #776e65;
      --border: #d5c9bc;
      --border-strong: #c3b4a5;
      --accent: #78685b;
      --accent-dark: #55483e;
      --accent-soft: #e7ddd2;
      --blue: #5f84ad;
      --green: #668b72;
      --yellow: #d8b960;
      --blocked: #77706a;
      --danger: #9b5a52;
      --day-width: 190px;
      --slot-height: 38px;
      --radius: 20px;
      --shadow: 0 12px 32px rgba(74, 59, 46, .08);
      --shadow-soft: 0 4px 14px rgba(74, 59, 46, .06);
    }

    * { box-sizing: border-box; }

    html {
      color-scheme: light;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.72), transparent 30%),
        linear-gradient(180deg, #f4efe8 0%, var(--bg) 46%, #e8e0d7 100%);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button, input { font: inherit; }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    .hidden { display: none !important; }

    .app {
      width: min(100%, 1500px);
      margin: 0 auto;
      padding: 14px 14px 42px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 8px 0 12px;
      background: linear-gradient(var(--bg) 84%, rgba(238,232,223,0));
      backdrop-filter: blur(12px);
    }

    .panel {
      background: rgba(251,248,242,.96);
      border: 1px solid rgba(213,201,188,.94);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .topbar-panel {
      padding: 16px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      min-width: 0;
    }

    .brand::before {
      content: "2026";
      display: inline-block;
      margin-bottom: 5px;
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      letter-spacing: .2em;
    }

    .brand-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 700;
      letter-spacing: .1em;
    }

    .current-user {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-top: 8px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 800;
    }

    .settings-btn,
    .nav-btn,
    .utility-btn,
    .save-btn,
    .back-btn {
      min-height: 46px;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      background: linear-gradient(180deg, #fcfaf6, #eee6dc);
      color: var(--text);
      padding: 10px 15px;
      font-weight: 800;
      box-shadow: var(--shadow-soft);
    }

    .settings-btn {
      min-width: 84px;
      white-space: nowrap;
    }

    .section-label {
      display: block;
      margin: 16px 0 9px;
      color: var(--accent-dark);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .09em;
    }

    .brushes {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
    }

    .brush {
      min-height: 60px;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 9px 8px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 900;
      box-shadow: var(--shadow-soft);
      position: relative;
    }

    .brush::before {
      content: "";
      display: block;
      width: 21px;
      height: 21px;
      margin: 0 auto 5px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.12);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.32);
    }

    .brush[data-brush="blue"]::before { background: var(--blue); }
    .brush[data-brush="green"]::before { background: var(--green); }
    .brush[data-brush="yellow"]::before { background: var(--yellow); }

    .brush[data-brush="blocked"]::before {
      background:
        repeating-linear-gradient(
          135deg,
          #69645f 0,
          #69645f 5px,
          #918b84 5px,
          #918b84 10px
        );
    }

    .brush[data-brush="erase"]::before {
      border-radius: 5px;
      background: linear-gradient(135deg, #fffdf9 0 50%, #d3c8bc 50% 100%);
    }

    .brush.active {
      border: 2px solid var(--accent-dark);
      background: #fffdf9;
      box-shadow:
        0 0 0 4px rgba(120,104,91,.13),
        var(--shadow-soft);
      transform: translateY(-1px);
    }

    .brush:active,
    .settings-btn:active,
    .nav-btn:active,
    .utility-btn:active,
    .save-btn:active,
    .back-btn:active {
      transform: scale(.98);
    }

    .status {
      margin-top: 12px;
      min-height: 48px;
      display: flex;
      align-items: center;
      padding: 10px 13px;
      border: 1px solid #d8cdc2;
      border-radius: 14px;
      background: #eee5db;
      color: var(--accent-dark);
      font-size: 14px;
      font-weight: 760;
      line-height: 1.5;
    }

    .month-bar {
      display: grid;
      grid-template-columns: auto minmax(160px, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }

    .month-title {
      text-align: center;
      color: var(--accent-dark);
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
      font-size: clamp(23px, 5vw, 32px);
      font-weight: 700;
      letter-spacing: .05em;
    }

    .utility-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .zoom-value {
      min-width: 58px;
      text-align: center;
      color: var(--accent-dark);
      font-weight: 900;
    }

    .hint {
      margin: 13px 4px 9px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.72;
    }

    .calendar-shell {
      width: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(251,248,242,.97);
      box-shadow: var(--shadow);
      -webkit-overflow-scrolling: touch;
    }

    .calendar-stage {
      width: max-content;
      min-width: 100%;
      padding: 12px;
    }

    .weekdays,
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, var(--day-width));
      gap: 8px;
    }

    .weekdays {
      position: sticky;
      top: 0;
      z-index: 4;
      padding-bottom: 8px;
      background: rgba(251,248,242,.98);
    }

    .weekday {
      padding: 10px 4px;
      border: 1px solid #ddd2c7;
      border-radius: 12px;
      background: #eee5db;
      text-align: center;
      color: var(--accent-dark);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .09em;
    }

    .weekday.sun { color: #995b55; }
    .weekday.sat { color: #506f91; }

    .day {
      min-height: 0;
      height: max-content;
      align-self: start;
      border: 1px solid #ddd2c7;
      border-radius: 16px;
      background: linear-gradient(180deg, #faf6f0, #f1e8de);
      padding: 9px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
    }

    .day.empty {
      min-height: 0;
      height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .day.today {
      border: 2px solid var(--accent);
      box-shadow:
        0 0 0 3px rgba(120,104,91,.12),
        inset 0 1px 0 rgba(255,255,255,.8);
      padding: 8px;
    }

    .day-header {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 8px;
    }

    .date-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      border-radius: 999px;
      color: var(--accent-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 700;
    }

    .today .date-number {
      background: var(--accent);
      color: #fff;
    }

    .filled-count {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .hours {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .hour {
      position: relative;
      width: 100%;
      min-width: 0;
      height: var(--slot-height);
      border: 1px solid #cfc3b6;
      border-radius: 9px;
      background: #fbf7f1;
      color: #433b34;
      padding: 0 9px;
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      overflow: hidden;
      user-select: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.82);
      text-align: left;
    }

    .hour-time {
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
      letter-spacing: .01em;
    }

    .hour-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 900;
      text-align: right;
    }

    .hour.blue {
      background: linear-gradient(180deg, #6e94bc, var(--blue));
      border-color: #496e96;
      color: #fff;
    }

    .hour.green {
      background: linear-gradient(180deg, #789d84, var(--green));
      border-color: #4f725c;
      color: #fff;
    }

    .hour.yellow {
      background: linear-gradient(180deg, #e4ca74, var(--yellow));
      border-color: #b69a4d;
      color: #2f2a24;
    }

    .hour.blocked {
      background:
        repeating-linear-gradient(
          135deg,
          #69645f 0,
          #69645f 7px,
          #8a837c 7px,
          #8a837c 14px
        );
      border-color: #56514c;
      color: #fff;
    }

    .hour:focus-visible {
      outline: 3px solid #2b2723;
      outline-offset: 1px;
      z-index: 2;
    }

    .hour:active {
      transform: scale(.97);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 11px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(251,248,242,.78);
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.15);
    }

    .dot.blue { background: var(--blue); }
    .dot.green { background: var(--green); }
    .dot.yellow { background: var(--yellow); }
    .dot.blocked { background: var(--blocked); }

    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }

    .danger { color: var(--danger); }

    .save-note {
      margin-top: 11px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .settings-page {
      width: min(100%, 620px);
      margin: 0 auto;
      padding-top: 16px;
    }

    .settings-card {
      padding: 22px;
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 22px;
    }

    .settings-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: var(--accent-dark);
      font-weight: 900;
      font-size: 16px;
    }

    .name-input {
      width: 100%;
      min-height: 56px;
      padding: 13px 15px;
      border: 1px solid var(--border-strong);
      border-radius: 15px;
      background: #fffdf9;
      color: var(--text);
      font-size: 19px;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(75,62,49,.04);
    }

    .name-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(120,104,91,.14);
    }

    .settings-help {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .settings-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .save-btn {
      background: linear-gradient(180deg, #8a7869, var(--accent));
      color: #fff;
      border-color: var(--accent);
      min-height: 56px;
      font-size: 17px;
    }

    .back-btn {
      min-height: 50px;
    }

    @media (max-width: 760px) {
      :root {
        --day-width: 176px;
        --slot-height: 40px;
      }

      .app {
        padding: 8px 8px 32px;
      }

      .topbar {
        padding-top: 4px;
      }

      .topbar-panel {
        padding: 12px;
      }

      .brand-title {
        font-size: 25px;
      }

      .settings-btn {
        min-width: 78px;
        padding-inline: 11px;
      }

      .brushes {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .brush[data-brush="erase"] {
        grid-column: 1 / -1;
      }

      .brush {
        min-height: 62px;
        font-size: 15px;
      }

      .month-bar {
        grid-template-columns: 76px minmax(0, 1fr) 76px;
        gap: 6px;
      }

      .nav-btn {
        min-height: 48px;
        padding-inline: 7px;
        font-size: 15px;
      }

      .status {
        font-size: 14px;
      }

      .utility-btn {
        min-height: 46px;
      }

      .calendar-stage {
        padding: 8px;
      }

      .calendar-shell {
        border-radius: 15px;
      }

      .hour {
        grid-template-columns: 60px minmax(0, 1fr);
        padding-inline: 9px;
      }

      .hour-time {
        font-size: 12px;
      }

      .hour-name {
        font-size: 11px;
      }

      .settings-page {
        padding-top: 8px;
      }

      .settings-card {
        padding: 17px;
      }
    }

    @media (max-width: 390px) {
      .brand-title { font-size: 23px; }
      .current-user { font-size: 12px; }

      .brush {
        min-height: 60px;
        font-size: 14px;
      }

      .utility-row {
        gap: 6px;
      }

      .utility-btn {
        padding-inline: 10px;
      }
    }

    @media print {
      body { background: #fff; }
      .topbar, .hint, .footer-actions, .save-note, .legend { display: none !important; }
      .app { width: 100%; padding: 0; }
      .calendar-shell { overflow: visible; box-shadow: none; border: 0; }
      .calendar-stage { transform: scale(.48); transform-origin: top left; }
    }
  </style>

  <script>
    (() => {
      "use strict";

      const now = new Date();
      const YEAR = now.getFullYear();
      const STORAGE_KEY = `care-calendar-${YEAR}-v2`;
      const LEGACY_NAME_KEY = "care-calendar-name-v2";
      const PEOPLE_KEY = "care-calendar-people-v3";
      const SHEET_API_URL = "";
      const SHEET_API_TOKEN = "41016d672415456a926603d5fd1dd2faa1c71b66dfad41549feb0094432f39d8";
      const REMOTE_QUEUE_KEY = "care-calendar-remote-queue-v1";
      const DEVICE_KEY = "care-calendar-device-v1";
      const DEFAULT_PEOPLE = { blue: "人員一", green: "人員二", yellow: "人員三" };

      let month = now.getMonth();
      let brush = "blue";
      let scale = window.innerWidth <= 760 ? 1 : 1;
      let viewMode = "month";
      let selectedDay = now.getDate();
      let schedule = loadSchedule();
      let people = loadPeople();
      const undoStack = [];

      const homePage = document.getElementById("homePage");
      const settingsPage = document.getElementById("settingsPage");
      const currentUser = document.getElementById("currentUser");
      const monthTitle = document.getElementById("monthTitle");
      const calendar = document.getElementById("calendar");
      const calendarShell = document.getElementById("calendarShell");
      const status = document.getElementById("status");
      const zoomValue = document.getElementById("zoomValue");
      const prevMonthButton = document.getElementById("prevMonth");
      const nextMonthButton = document.getElementById("nextMonth");
      const undoButton = document.getElementById("undoLast");
      const detailDate = document.getElementById("detailDate");
      const nameInputs = {
        blue: document.getElementById("blueName"),
        green: document.getElementById("greenName"),
        yellow: document.getElementById("yellowName")
      };

      function loadSchedule() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (error) {
          console.warn("無法讀取既有資料", error);
          return {};
        }
      }

      function saveSchedule() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
        } catch (error) {
          status.textContent = "儲存失敗，請確認瀏覽器是否允許網站儲存資料。";
        }
      }

      function loadPeople() {
        try {
          const raw = localStorage.getItem(PEOPLE_KEY);
          if (raw) return { ...DEFAULT_PEOPLE, ...JSON.parse(raw) };
        } catch (error) {
          console.warn("無法讀取人員設定", error);
        }
        const legacyName = localStorage.getItem(LEGACY_NAME_KEY) || "";
        return { ...DEFAULT_PEOPLE, blue: legacyName || DEFAULT_PEOPLE.blue };
      }

      function savePeople() {
        localStorage.setItem(PEOPLE_KEY, JSON.stringify(people));
      }

      let remoteSending = false;

      function cloudEnabled() {
        return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(SHEET_API_URL);
      }

      function deviceId() {
        let id = localStorage.getItem(DEVICE_KEY);
        if (!id) {
          id = `device-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
          localStorage.setItem(DEVICE_KEY, id);
        }
        return id;
      }

      function readRemoteQueue() {
        try { return JSON.parse(localStorage.getItem(REMOTE_QUEUE_KEY) || "[]"); }
        catch (_) { return []; }
      }

      function writeRemoteQueue(queue) {
        localStorage.setItem(REMOTE_QUEUE_KEY, JSON.stringify(queue));
      }

      function slotForRemote(id) {
        const entry = schedule[id];
        if (!entry) return null;
        const hour = Number(id.slice(-2));
        return {
          id,
          date: id.slice(0, 10),
          start: formatHour(hour),
          end: formatHour(hour + 1),
          name: entry.color === "blocked" ? "" : entry.name || colorLabel(entry.color),
          color: entry.color,
          note: ""
        };
      }

      function queueSlotIds(ids) {
        const uniqueIds = [...new Set(ids)];
        if (!uniqueIds.length) return;
        const upserts = uniqueIds.map(slotForRemote).filter(Boolean);
        const deletes = uniqueIds.filter((id) => !schedule[id]);
        enqueueRemote({ action: "applyChanges", upserts, deletes, updatedBy: deviceId() });
      }

      function queueSlotChanges(changes) {
        queueSlotIds(Array.from(changes.keys()));
      }

      function queuePeopleUpdate() {
        enqueueRemote({ action: "setPeople", people: { ...people }, updatedBy: deviceId() });
      }

      function enqueueRemote(payload) {
        const queue = readRemoteQueue();
        queue.push({ ...payload, queuedAt: new Date().toISOString() });
        writeRemoteQueue(queue);
        processRemoteQueue();
      }

      async function remoteRequest(payload) {
        const response = await fetch(SHEET_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ ...payload, token: SHEET_API_TOKEN }),
          redirect: "follow"
        });
        const data = JSON.parse(await response.text());
        if (!response.ok || !data.ok) throw new Error(data.error || "Google Sheet 儲存失敗");
        return data;
      }

      async function processRemoteQueue() {
        if (!cloudEnabled() || remoteSending || !navigator.onLine) return;
        const queue = readRemoteQueue();
        if (!queue.length) return;
        remoteSending = true;
        try {
          await remoteRequest(queue[0]);
          queue.shift();
          writeRemoteQueue(queue);
          if (queue.length) window.setTimeout(processRemoteQueue, 150);
        } catch (error) {
          console.warn("雲端同步暫停", error);
          status.textContent = "目前無法連上 Google Sheet，資料已保存在這支裝置，稍後會自動重試。";
        } finally {
          remoteSending = false;
        }
      }

      async function loadRemoteState() {
        if (!cloudEnabled()) return;
        try {
          const url = `${SHEET_API_URL}?action=state&token=${encodeURIComponent(SHEET_API_TOKEN)}&_=${Date.now()}`;
          const response = await fetch(url, { method: "GET", cache: "no-store", redirect: "follow" });
          const data = JSON.parse(await response.text());
          if (!response.ok || !data.ok) throw new Error(data.error || "Google Sheet 讀取失敗");
          const remoteSchedule = data.schedule || {};
          const localIds = Object.keys(schedule);
          const remoteIds = Object.keys(remoteSchedule);
          if (!remoteIds.length && localIds.length) {
            queueSlotIds(localIds);
            queuePeopleUpdate();
            status.textContent = "正在把這支裝置的既有排班上傳到 Google Sheet。";
          } else {
            schedule = remoteSchedule;
            people = { ...DEFAULT_PEOPLE, ...(data.people || {}) };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule));
            localStorage.setItem(PEOPLE_KEY, JSON.stringify(people));
            updateBrushLabels();
            updateCurrentUser();
            render();
            status.textContent = "已載入 Google Sheet 共用排班。";
          }
          processRemoteQueue();
        } catch (error) {
          console.warn("無法載入雲端排班", error);
          status.textContent = "Google Sheet 暫時無法連線，目前先使用這支裝置內的資料。";
        }
      }
      function updateBrushLabels() {
        document.querySelectorAll(".brush").forEach((button) => {
          const value = button.dataset.brush;
          const label = value === "blocked" ? "不可" : value === "erase" ? "清除" : people[value];
          button.textContent = label;
          button.title = label;
          button.setAttribute("aria-label", value === "blocked" ? "標記不能安排" : value === "erase" ? "清除時段" : `選擇${label}`);
          if (people[value]) {
            const legendId = `legend${value[0].toUpperCase()}${value.slice(1)}`;
            const legend = document.getElementById(legendId);
            if (legend) legend.textContent = people[value];
          }
        });
      }

      function updateCurrentUser() {
        const names = [...new Set(Object.values(people).filter(Boolean))];
        currentUser.textContent = names.length ? `排班人員：${names.join("、")}` : "尚未設定人員";
      }

      function openSettings() {
        Object.keys(nameInputs).forEach((color) => { nameInputs[color].value = people[color] || ""; });
        homePage.classList.add("hidden");
        settingsPage.classList.remove("hidden");
        setTimeout(() => nameInputs.blue.focus(), 50);
      }

      function closeSettings() {
        settingsPage.classList.add("hidden");
        homePage.classList.remove("hidden");
        updateCurrentUser();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function monthDays(targetMonth = month) {
        return new Date(YEAR, targetMonth + 1, 0).getDate();
      }

      function dateKey(day) {
        return `${YEAR}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      function slotKey(day, hour) {
        return `${dateKey(day)}-${String(hour).padStart(2, "0")}`;
      }

      function formatHour(hour) {
        return `${String(hour % 24).padStart(2, "0")}:00`;
      }

      function formatRange(hour) {
        return `${formatHour(hour)}–${formatHour(hour + 1)}`;
      }

      function colorLabel(color) {
        return color === "blocked" ? "不能排" : people[color] || color;
      }

      function render() {
        monthTitle.textContent = `${YEAR} 年 ${month + 1} 月`;
        prevMonthButton.disabled = month === 0;
        nextMonthButton.disabled = month === 11;
        calendar.innerHTML = "";
        document.body.classList.toggle("view-month", viewMode === "month");
        document.body.classList.toggle("view-detail", viewMode === "detail");
        calendarShell.classList.toggle("overview-mode", viewMode === "month");
        calendarShell.classList.toggle("detail-mode", viewMode === "detail");
        calendarShell.setAttribute("aria-label", viewMode === "month" ? "整月交班月曆" : `${month + 1}月${selectedDay}日排班`);
        if (viewMode === "detail") {
          selectedDay = Math.max(1, Math.min(monthDays(), selectedDay));
          const weekday = ["日", "一", "二", "三", "四", "五", "六"][new Date(YEAR, month, selectedDay).getDay()];
          detailDate.textContent = `${month + 1}月${selectedDay}日（${weekday}）`;
          calendar.appendChild(createDay(selectedDay));
          applyScale();
          return;
        }
        // 週一為第一欄：JavaScript 週日=0，轉換後週一=0、週日=6。
        const firstWeekday = (new Date(YEAR, month, 1).getDay() + 6) % 7;
        const totalDays = monthDays();
        const totalCells = Math.ceil((firstWeekday + totalDays) / 7) * 7;
        for (let index = 0; index < totalCells; index += 1) {
          const day = index - firstWeekday + 1;
          if (day < 1 || day > totalDays) {
            const empty = document.createElement("div");
            empty.className = "day-overview empty";
            empty.setAttribute("aria-hidden", "true");
            calendar.appendChild(empty);
            continue;
          }
          calendar.appendChild(createMonthDay(day));
        }
        applyScale();
      }

      function getDayShiftSegments(day) {
        const segments = [];
        let current = null;

        for (let hour = 0; hour < 24; hour += 1) {
          const entry = schedule[slotKey(day, hour)];

          if (!entry) {
            if (current) {
              segments.push(current);
              current = null;
            }
            continue;
          }

          const name = entry.color === "blocked"
            ? "不能排"
            : entry.name || colorLabel(entry.color);
          const signature = `${entry.color}|${name}`;

          if (current && current.signature === signature && current.end === hour) {
            current.end = hour + 1;
          } else {
            if (current) segments.push(current);
            current = {
              signature,
              color: entry.color,
              name,
              start: hour,
              end: hour + 1
            };
          }
        }

        if (current) segments.push(current);
        return segments;
      }

      function formatShiftHour(hour) {
        if (hour === 24) return "24:00";
        return `${String(hour).padStart(2, "0")}:00`;
      }

      function formatShiftRange(start, end) {
        return `${formatShiftHour(start)}–${formatShiftHour(end)}`;
      }

      function formatCompactShiftRange(start, end) {
        return `${start}–${end}`;
      }

      function compactPersonName(segment) {
        if (segment.color === "blocked") return "不可";
        const label = segment.name || colorLabel(segment.color);
        return label.length > 2 ? label.slice(0, 2) : label;
      }

      function createMonthDay(day) {
        const isToday = now.getFullYear() === YEAR && now.getMonth() === month && now.getDate() === day;
        const button = document.createElement("button");
        button.type = "button";
        button.className = `day-overview${isToday ? " today" : ""}`;
        button.dataset.day = String(day);

        const date = document.createElement("span");
        date.className = "overview-date";
        date.textContent = day;

        const segments = getDayShiftSegments(day);

        const compactList = document.createElement("span");
        compactList.className = "day-shift-compact";

        const compactLimit = 3;
        segments.slice(0, compactLimit).forEach((segment) => {
          const chip = document.createElement("span");
          chip.className = `compact-shift-chip ${segment.color}`;
          chip.textContent = compactPersonName(segment);
          chip.title = `${segment.name} ${formatShiftRange(segment.start, segment.end)}`;
          compactList.appendChild(chip);
        });

        if (segments.length > compactLimit) {
          const more = document.createElement("span");
          more.className = "compact-shift-more";
          more.textContent = `＋${segments.length - compactLimit} 段`;
          compactList.appendChild(more);
        }

        const fullList = document.createElement("span");
        fullList.className = "day-shift-full";

        segments.forEach((segment) => {
          const chip = document.createElement("span");
          chip.className = `full-shift-chip ${segment.color}`;

          const person = document.createElement("span");
          person.className = "full-shift-person";
          person.textContent = segment.name;

          const time = document.createElement("span");
          time.className = "full-shift-time";
          time.textContent = formatShiftRange(segment.start, segment.end);

          chip.append(person, time);
          fullList.appendChild(chip);
        });

        const readableSummary = segments
          .map((segment) => `${segment.name} ${formatShiftRange(segment.start, segment.end)}`)
          .join("，");

        button.setAttribute(
          "aria-label",
          `${month + 1}月${day}日${readableSummary ? `，${readableSummary}` : "，尚未排班"}，點一下查看完整時間`
        );

        button.append(date, compactList, fullList);
        return button;
      }

      function createDay(day) {
        const isToday = now.getFullYear() === YEAR && now.getMonth() === month && now.getDate() === day;
        const dayElement = document.createElement("section");
        dayElement.className = `day${isToday ? " today" : ""}`;
        dayElement.setAttribute("aria-label", `${month + 1}月${day}日`);
        const header = document.createElement("div");
        header.className = "day-header";
        const number = document.createElement("span");
        number.className = "date-number";
        number.textContent = day;
        const count = document.createElement("span");
        count.className = "filled-count";
        const filled = Array.from({ length: 24 }, (_, hour) => schedule[slotKey(day, hour)]).filter(Boolean).length;
        count.textContent = filled ? `${filled} 小時` : "";
        header.append(number, count);
        const hours = document.createElement("div");
        hours.className = "hours";
        for (let hour = 0; hour < 24; hour += 1) hours.appendChild(createHourButton(day, hour));
        dayElement.append(header, hours);
        return dayElement;
      }

      function createHourButton(day, hour) {
        const value = schedule[slotKey(day, hour)];
        const button = document.createElement("button");
        button.type = "button";
        button.className = `hour${value ? ` ${value.color}` : ""}`;
        button.dataset.day = String(day);
        button.dataset.hour = String(hour);
        const time = document.createElement("span");
        time.className = "hour-time";
        time.textContent = formatHour(hour);
        const name = document.createElement("span");
        name.className = "hour-name";
        name.textContent = value ? (value.color === "blocked" ? "不可" : value.name || colorLabel(value.color)) : "";
        button.append(time, name);
        updateHourAria(button, day, hour, value);
        return button;
      }

      function updateHourAria(button, day, hour, value) {
        const displayName = value?.color === "blocked" ? "，不能安排" : value?.name ? `，${value.name}` : "";
        button.setAttribute("aria-label", `${month + 1}月${day}日 ${formatRange(hour)}${displayName}`);
      }

      function updateHourButton(button, value) {
        button.classList.remove("blue", "green", "yellow", "blocked");
        if (value) button.classList.add(value.color);
        const name = button.querySelector(".hour-name");
        if (name) name.textContent = value ? (value.color === "blocked" ? "不可" : value.name || colorLabel(value.color)) : "";
        updateHourAria(button, Number(button.dataset.day), Number(button.dataset.hour), value);
      }

      function ensureBrushReady() {
        if (brush === "erase" || brush === "blocked" || people[brush]) return true;
        status.textContent = "請先到姓名設定輸入人員姓名。";
        openSettings();
        return false;
      }

      function applySlot(day, hour, changes, button) {
        const key = slotKey(day, hour);
        const before = schedule[key] ? { ...schedule[key] } : null;
        const after = brush === "erase" ? null : { color: brush, name: brush === "blocked" ? "" : people[brush] };
        if (JSON.stringify(before) === JSON.stringify(after)) return false;
        if (!changes.has(key)) changes.set(key, before);
        if (after) schedule[key] = after;
        else delete schedule[key];
        if (button) updateHourButton(button, after);
        return true;
      }

      function pushUndo(changes) {
        if (!changes.size) return;
        undoStack.push(Array.from(changes, ([key, value]) => ({ key, value })));
        if (undoStack.length > 20) undoStack.shift();
        undoButton.classList.remove("hidden");
      }

      function paint(day, hour) {
        if (!ensureBrushReady()) return;
        const changes = new Map();
        if (!applySlot(day, hour, changes, null)) return;
        pushUndo(changes);
        saveSchedule();
        queueSlotChanges(changes);
        render();
        status.textContent = brush === "erase"
          ? `${month + 1}月${day}日 ${formatRange(hour)} 已清除。`
          : `${month + 1}月${day}日 ${formatRange(hour)}｜${colorLabel(brush)}`;
      }

      function undoLastAction() {
        const changes = undoStack.pop();
        if (!changes) return;
        changes.forEach(({ key, value }) => { if (value) schedule[key] = value; else delete schedule[key]; });
        saveSchedule();
        queueSlotIds(changes.map(({ key }) => key));
        render();
        status.textContent = "已復原上一步。";
        undoButton.classList.toggle("hidden", undoStack.length === 0);
      }

      function applyScale() {
        scale = Math.max(0.72, Math.min(1.55, scale));
        const viewportWidth = Math.max(360, Math.min(760, window.innerWidth - 16));
        const overviewZoom = scale >= 1.18 ? scale * 2.15 : 1;
        const overviewWidth = Math.round(viewportWidth * overviewZoom);
        document.documentElement.style.setProperty("--day-width", `${Math.round(138 * scale)}px`);
        document.documentElement.style.setProperty("--slot-height", `${Math.round(34 * scale)}px`);
        document.documentElement.style.setProperty("--overview-cell-height", `${scale >= 1.18 ? Math.round(126 * scale) : Math.round(80 * scale)}px`);
        document.documentElement.style.setProperty("--overview-width", `${overviewWidth}px`);
        calendarShell.classList.toggle("zoomed-overview", viewMode === "month" && scale >= 1.18);
        zoomValue.textContent = `${Math.round(scale * 100)}%`;
      }

      function csvCell(value) {
        const text = String(value ?? "");
        return /[",\r\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
      }

      function parseCsvLine(line) {
        const result = [];
        let value = "";
        let quoted = false;
        for (let index = 0; index < line.length; index += 1) {
          const character = line[index];
          if (character === '"') {
            if (quoted && line[index + 1] === '"') { value += '"'; index += 1; }
            else quoted = !quoted;
          } else if (character === "," && !quoted) {
            result.push(value);
            value = "";
          } else value += character;
        }
        result.push(value);
        return result;
      }

      function downloadExcelBackup() {
        const rows = [["日期", "開始時間", "結束時間", "人員", "狀態", "顏色"]];
        Object.keys(schedule).sort().forEach((key) => {
          const match = key.match(/^(\d{4}-\d{2}-\d{2})-(\d{2})$/);
          if (!match) return;
          const entry = schedule[key];
          const hour = Number(match[2]);
          rows.push([
            match[1],
            formatHour(hour),
            formatHour(hour + 1),
            entry.color === "blocked" ? "" : entry.name || colorLabel(entry.color),
            entry.color === "blocked" ? "不能排" : "已排班",
            entry.color
          ]);
        });
        const csv = "\uFEFF" + rows.map((row) => row.map(csvCell).join(",")).join("\r\n");
        const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = `交班月曆-${YEAR}-全年.csv`;
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.textContent = "Excel 備份已下載，請保存到 OneDrive。";
      }

      async function importExcelBackup(file) {
        const text = (await file.text()).replace(/^\uFEFF/, "");
        const lines = text.split(/\r?\n/).filter(Boolean);
        if (lines.length < 2) throw new Error("備份檔沒有排班資料");
        const changes = new Map();
        let imported = 0;
        lines.slice(1).forEach((line) => {
          const [date, start, , name, state, color] = parseCsvLine(line);
          if (!date?.startsWith(`${YEAR}-`)) return;
          const hour = Number(start?.slice(0, 2));
          const safeColor = state === "不能排" ? "blocked" : color;
          if (!Number.isInteger(hour) || hour < 0 || hour > 23 || !["blue", "green", "yellow", "blocked"].includes(safeColor)) return;
          const key = `${date}-${String(hour).padStart(2, "0")}`;
          if (!changes.has(key)) changes.set(key, schedule[key] ? { ...schedule[key] } : null);
          schedule[key] = { color: safeColor, name: safeColor === "blocked" ? "" : name || people[safeColor] };
          imported += 1;
        });
        if (!imported) throw new Error(`找不到 ${YEAR} 年可匯入的時段`);
        pushUndo(changes);
        saveSchedule();
        queueSlotChanges(changes);
        render();
        status.textContent = `已從 Excel 備份匯入 ${imported} 個小時，可復原上一步。`;
      }
      function clearByPrefix(prefix) {
        const changes = new Map();
        Object.keys(schedule).forEach((key) => {
          if (!key.startsWith(prefix)) return;
          changes.set(key, { ...schedule[key] });
          delete schedule[key];
        });
        pushUndo(changes);
        saveSchedule();
        queueSlotChanges(changes);
        render();
      }

      document.querySelectorAll(".brush").forEach((button) => {
        button.addEventListener("click", () => {
          brush = button.dataset.brush;
          document.querySelectorAll(".brush").forEach((item) => {
            item.classList.remove("active");
            item.setAttribute("aria-pressed", "false");
          });
          button.classList.add("active");
          button.setAttribute("aria-pressed", "true");
          status.textContent = brush === "erase"
            ? "已選清除：點一下或長按拖動可擦除時段。"
            : brush === "blocked"
              ? "已選不能排：點一下或長按拖動可連續標記。"
              : `已選${colorLabel(brush)}：點一下或長按拖動時間。`;
        });
      });

      document.getElementById("openSettings").addEventListener("click", openSettings);
      document.getElementById("closeSettings").addEventListener("click", closeSettings);
      undoButton.addEventListener("click", undoLastAction);

      document.getElementById("saveSettings").addEventListener("click", () => {
        people = {
          blue: nameInputs.blue.value.trim() || DEFAULT_PEOPLE.blue,
          green: nameInputs.green.value.trim() || DEFAULT_PEOPLE.green,
          yellow: nameInputs.yellow.value.trim() || DEFAULT_PEOPLE.yellow
        };
        savePeople();
        Object.keys(schedule).forEach((key) => {
          const entry = schedule[key];
          if (entry && entry.color !== "blocked" && people[entry.color]) entry.name = people[entry.color];
        });
        localStorage.removeItem(LEGACY_NAME_KEY);
        saveSchedule();
        queuePeopleUpdate();
        updateBrushLabels();
        updateCurrentUser();
        render();
        closeSettings();
        status.textContent = "名字已更新";
      });

      document.getElementById("prevMonth").addEventListener("click", () => {
        if (month > 0) { month -= 1; viewMode = "month"; render(); calendarShell.scrollTo({ left: 0, behavior: "smooth" }); }
      });
      document.getElementById("nextMonth").addEventListener("click", () => {
        if (month < 11) { month += 1; viewMode = "month"; render(); calendarShell.scrollTo({ left: 0, behavior: "smooth" }); }
      });
      document.getElementById("goToday").addEventListener("click", () => { month = now.getMonth(); selectedDay = now.getDate(); viewMode = "month"; render(); });
      document.getElementById("zoomIn").addEventListener("click", () => { scale += 0.1; applyScale(); });
      document.getElementById("zoomOut").addEventListener("click", () => { scale -= 0.1; applyScale(); });
      document.getElementById("zoomReset").addEventListener("click", () => { scale = 1; applyScale(); });
      document.getElementById("backToMonth").addEventListener("click", () => {
        viewMode = "month";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.getElementById("clearMonth").addEventListener("click", () => {
        const ok = window.confirm(`確定清除 ${YEAR} 年 ${month + 1} 月的全部排班嗎？`);
        if (!ok) return;
        clearByPrefix(`${YEAR}-${String(month + 1).padStart(2, "0")}`);
        status.textContent = `${month + 1}月已清除，可按「復原上一步」救回。`;
      });
      document.getElementById("clearAll").addEventListener("click", () => {
        const ok = window.confirm(`確定清除 ${YEAR} 年的全部排班嗎？`);
        if (!ok) return;
        const changes = new Map(Object.keys(schedule).map((key) => [key, { ...schedule[key] }]));
        schedule = {};
        pushUndo(changes);
        saveSchedule();
        queueSlotChanges(changes);
        render();
        status.textContent = "全年排班已清除，可按「復原上一步」救回。";
      });
      document.getElementById("printPage").addEventListener("click", () => window.print());
      document.getElementById("downloadBackup").addEventListener("click", downloadExcelBackup);
      document.getElementById("importBackup").addEventListener("click", () => document.getElementById("backupFile").click());
      document.getElementById("backupFile").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        try { await importExcelBackup(file); }
        catch (error) { status.textContent = `匯入失敗：${error.message}`; }
        event.target.value = "";
      });

      let strokeChanges = null;
      let strokeVisited = null;
      let mousePainting = false;
      let touchPainting = false;
      let touchTimer = 0;
      let touchStartX = 0;
      let touchStartY = 0;
      let suppressClickUntil = 0;

      function beginStroke(button) {
        if (!ensureBrushReady()) return false;
        strokeChanges = new Map();
        strokeVisited = new Set();
        calendarShell.classList.add("is-painting");
        continueStrokeOn(button);
        return true;
      }
      function continueStrokeOn(button) {
        if (!button || !strokeChanges || strokeVisited.has(button)) return;
        strokeVisited.add(button);
        applySlot(Number(button.dataset.day), Number(button.dataset.hour), strokeChanges, button);
      }
      function continueStrokeAt(x, y) {
        const element = document.elementFromPoint(x, y);
        const button = element?.closest?.(".hour");
        if (button && calendarShell.contains(button)) continueStrokeOn(button);
      }
      function finishStroke() {
        calendarShell.classList.remove("is-painting");
        const count = strokeChanges?.size || 0;
        if (count) {
          pushUndo(strokeChanges);
          saveSchedule();
          queueSlotChanges(strokeChanges);
          render();
          status.textContent = brush === "erase"
            ? `已連續清除 ${count} 個小時，可復原上一步。`
            : `已替${colorLabel(brush)}連續填寫 ${count} 個小時，可復原上一步。`;
        }
        strokeChanges = null;
        strokeVisited = null;
        mousePainting = false;
        touchPainting = false;
        suppressClickUntil = Date.now() + 500;
      }

      calendarShell.addEventListener("click", (event) => {
        if (Date.now() < suppressClickUntil) return;
        const overviewDay = event.target.closest(".day-overview[data-day]");
        if (overviewDay) {
          selectedDay = Number(overviewDay.dataset.day);
          viewMode = "detail";
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        const button = event.target.closest(".hour");
        if (button) paint(Number(button.dataset.day), Number(button.dataset.hour));
      });
      calendarShell.addEventListener("mousedown", (event) => {
        if (event.button !== 0) return;
        const button = event.target.closest(".hour");
        if (!button) return;
        event.preventDefault();
        mousePainting = beginStroke(button);
      });
      document.addEventListener("mousemove", (event) => {
        if (!mousePainting) return;
        event.preventDefault();
        continueStrokeAt(event.clientX, event.clientY);
      });
      document.addEventListener("mouseup", () => { if (mousePainting) finishStroke(); });

      calendarShell.addEventListener("touchstart", (event) => {
        if (event.touches.length !== 1) return;
        const button = event.target.closest(".hour");
        if (!button) return;
        const touch = event.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        clearTimeout(touchTimer);
        touchTimer = window.setTimeout(() => {
          touchPainting = beginStroke(button);
          if (touchPainting && navigator.vibrate) navigator.vibrate(25);
        }, 380);
      }, { passive: true });
      calendarShell.addEventListener("touchmove", (event) => {
        if (event.touches.length !== 1) return;
        const touch = event.touches[0];
        if (!touchPainting) {
          const moved = Math.hypot(touch.clientX - touchStartX, touch.clientY - touchStartY);
          if (moved > 10) clearTimeout(touchTimer);
          return;
        }
        event.preventDefault();
        continueStrokeAt(touch.clientX, touch.clientY);
      }, { passive: false });
      calendarShell.addEventListener("touchend", () => { clearTimeout(touchTimer); if (touchPainting) finishStroke(); });
      calendarShell.addEventListener("touchcancel", () => { clearTimeout(touchTimer); if (touchPainting) finishStroke(); });

      let pinchStartDistance = 0;
      let pinchStartScale = scale;
      calendarShell.addEventListener("touchstart", (event) => {
        if (event.touches.length !== 2) return;
        clearTimeout(touchTimer);
        const [a, b] = event.touches;
        pinchStartDistance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        pinchStartScale = scale;
      }, { passive: true });
      calendarShell.addEventListener("touchmove", (event) => {
        if (event.touches.length !== 2 || !pinchStartDistance) return;
        event.preventDefault();
        const [a, b] = event.touches;
        const distance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        scale = pinchStartScale * (distance / pinchStartDistance);
        applyScale();
      }, { passive: false });
      calendarShell.addEventListener("touchend", (event) => {
        if (event.touches.length < 2 && pinchStartDistance) {
          pinchStartDistance = 0;
          suppressClickUntil = Date.now() + 350;
        }
      }, { passive: true });

      const toolsToggle = document.getElementById("toolsToggle");
      const moreTools = document.getElementById("moreTools");
      toolsToggle.addEventListener("click", () => {
        const isOpen = toolsToggle.getAttribute("aria-expanded") === "true";
        const nextOpen = !isOpen;
        toolsToggle.setAttribute("aria-expanded", String(nextOpen));
        moreTools.setAttribute("aria-hidden", String(!nextOpen));
        moreTools.classList.toggle("hidden", !nextOpen);
        const icon = toolsToggle.querySelector(".tools-toggle-icon");
        if (icon) icon.textContent = nextOpen ? "－" : "＋";
      });

      updateBrushLabels();
      updateCurrentUser();
      render();
      status.textContent = cloudEnabled()
        ? "正在連線 Google Sheet…"
        : `目前選擇：${colorLabel(brush)}。點一下或長按拖動時間。`;
      if (cloudEnabled()) {
        loadRemoteState();
        window.addEventListener("online", processRemoteQueue);
        window.setInterval(processRemoteQueue, 15000);
      }
    })();
  </script>
</body>
</html>
